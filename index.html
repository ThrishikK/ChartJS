<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
    <title>Fixed Size Chart</title>
  </head>
  <body>
    <canvas id="lineChart"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctx = document.getElementById("lineChart").getContext("2d");
      const lineChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: ["Jan", "Feb", "Mar", "Apr", "May"],
          datasets: [
            {
              label: "Expenditure",
              data: [100, 200, 150, 1000, 0],
              borderColor: "rebeccapurple",
              tension: 0.9,
              pointRadius: 5, // size of each point
              pointBackgroundColor: "rgb(200, 168, 231)", // fill color of each point
              pointBorderColor: "black", // border color
              pointHoverRadius: 8, // point grows on hover
              // Line color
              borderWidth: 3, // Thickness of the line
              borderDash: [5, 5], // Dashed line: 5px dash, 5px gap
              backgroundColor: "rgba(102, 51, 153, 0.2)", // Fills area under the line
              fill: true, // Enables the background fill
            },

            {
              label: "Savings",
              data: [300, 250, 400, 500, 600],
              borderColor: "seagreen",
              tension: 0.3,
            },
            {
              label: "Total",
              data: [400, 450, 550, 1500, 600],
              borderColor: "tomato",
              tension: 0.3,
            },
          ],
        },
        options: {
          responsive: false, // important: disables auto-resizing
        },
      });
    </script>
  </body>
</html>
