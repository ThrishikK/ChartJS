<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
    <title>Fixed Size Chart</title>
  </head>
  <body>
    <canvas id="lineChart"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctx = document.getElementById("lineChart").getContext("2d");
      const lineChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: ["Jan", "Feb", "Mar", "Apr", "May"],
          datasets: [
            {
              label: "Expenditure",
              data: [100, 200, 150, 1000, 0],
              borderColor: "rebeccapurple",
              tension: 0.3,
              // point
              pointRadius: 3,
              pointBackgroundColor: "rgb(200, 168, 231)",
              pointBorderColor: "black",
              pointHoverRadius: 8,
              // Line color
              borderWidth: 3,
              borderDash: [5, 0],
              backgroundColor: "rgba(102, 51, 153, 0.2)",
              fill: true,
            },

            {
              label: "Savings",
              data: [300, 250, 400, 500, 600],
              borderColor: "seagreen",
              tension: 0.3,
              // point
              pointRadius: 3,
              pointBackgroundColor: "rgb(143, 206, 170)",
              pointBorderColor: "black",
              pointHoverRadius: 8,
              // Line color
              borderWidth: 3,
              borderDash: [5, 0],
              backgroundColor: "rgba(14, 160, 77, 0.2)",
              fill: true,
            },
            {
              label: "Total",
              data: [400, 450, 550, 1500, 600],
              borderColor: "tomato",
              tension: 0.3,
              // point
              pointRadius: 3,
              pointBackgroundColor: "rgb(226, 167, 157)",
              pointBorderColor: "black",
              pointHoverRadius: 8,
              // Line color
              borderWidth: 3,
              borderDash: [5, 0],
              backgroundColor: "rgba(189, 40, 14, 0.2)",
              fill: true,
            },
            {
              label: "Water",
              data: [40, 40, 40, 40, 40],
              borderColor: "blue",
              tension: 0.3,
              // point
              pointRadius: 3,
              pointBackgroundColor: "rgb(0, 0, 150)",
              pointBorderColor: "black",
              pointHoverRadius: 8,
              // Line color
              borderWidth: 3,
              borderDash: [5, 0],
              backgroundColor: "rgba(20, 40, 255, 0.2)",
              fill: true,
            },
          ],
        },
        options: {
          responsive: false, // important: disables auto-resizing
        },
      });
    </script>
  </body>
</html>
